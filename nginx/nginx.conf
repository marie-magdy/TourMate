user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
	worker_connections  1024;
}

http {
	include       /etc/nginx/mime.types;
	default_type  application/octet-stream;

	sendfile        on;
	keepalive_timeout  65;

	upstream backend_up {
		server backend:3000;
	}

	upstream recommender_up {
		server recommendation_service:5002;
	}

	upstream cv_up {
		server cv_service:5001;
	}

	server {
		listen 80;
		server_name _;

		# Backend API (preserves /api/ prefix)
		location /api/ {
			proxy_pass http://backend_up$request_uri;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}

		# Recommendation service (mount at /recommender/)
		location /recommender/ {
			proxy_pass http://recommender_up/;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			rewrite ^/recommender/(.*)$ /$1 break;
		}

		# CV service (mount at /cv/)
		location /cv/ {
			proxy_pass http://cv_up/;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			rewrite ^/cv/(.*)$ /$1 break;
		}

		# Static files fallback (optional)
		location /uploads/ {
			proxy_pass http://backend_up$request_uri;
		}

		location / {
			return 200 'TourMate proxy';
			add_header Content-Type text/plain;
		}
	}
}
